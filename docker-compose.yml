version: '3.9'

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ava
      POSTGRES_PASSWORD: ava_dev_password
      POSTGRES_DB: ava_dental
    ports:
      - '5432:5432'
    volumes:
      - ava_pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - ava_redisdata:/data

volumes:
  ava_pgdata:
  ava_redisdata:
